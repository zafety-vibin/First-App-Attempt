version: '3.8'

services:
  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile.keycloak
    container_name: vvd-keycloak
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
    volumes:
      - keycloak-data:/opt/keycloak/data
    networks:
      - vvd-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vvd-backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_PATH: /app/data/vvd-mimic.db
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: vvd-mimic
      KEYCLOAK_CLIENT_ID: vvd-mimic-backend
      CORS_ORIGIN: http://localhost:3000
      PORT: 3001
      NODE_ENV: development
      SESSION_SECRET: dev-secret-change-in-production
    volumes:
      - ./data:/app/data
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
    networks:
      - vvd-network
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vvd-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: vvd-mimic
      VITE_KEYCLOAK_CLIENT_ID: vvd-mimic-frontend
      NODE_ENV: development
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/package.json:/app/package.json
    networks:
      - vvd-network
    depends_on:
      backend:
        condition: service_healthy

volumes:
  keycloak-data:

networks:
  vvd-network:
    driver: bridge
